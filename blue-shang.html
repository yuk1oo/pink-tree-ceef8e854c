<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>尚雲螣我只想和你</title><meta property="og:title" content="尚雲螣我只想和你">
<meta name="robots" content="noindex, nofollow">
<style>
*{box-sizing:border-box}body{margin:0;background:#050b1c;color:#fff3f9}button{font:inherit;min-height:44px;padding:0 14px;border:1px solid #af7897;border-radius:4px;background:#211021;color:#fff3f9;cursor:pointer}button:hover{background:#462039}button:focus-visible{outline:2px solid white;outline-offset:3px}
</style>
<main id="pink-christmas" data-style="halo">
<style>
#pink-christmas .scene{position:relative;overflow:hidden;background:#050b1c;height:100svh;min-height:320px;color:#fff3f9}
#pink-christmas canvas{display:block;width:100%;height:100%}
#pink-christmas .greeting{position:absolute;right:3%;bottom:5%;text-align:right;text-shadow:0 0 18px #6aaeff;pointer-events:none}
#pink-christmas .greeting strong{font:italic clamp(25px,4vw,68px) "Edwardian Script ITC","Segoe Script",Georgia,serif;font-weight:400}
#pink-christmas .greeting small{display:block;font:11px system-ui;letter-spacing:.42em;margin-top:4px}
#pink-christmas .actions{position:absolute;bottom:4%;left:3%;right:3%;display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;pointer-events:none}
#pink-christmas .actions{z-index:2}
#pink-christmas .actions button{pointer-events:auto}
#pink-christmas .modes,#pink-christmas .playback{display:flex;gap:5px}
#pink-christmas .modes{padding:4px;background:#10141fe8;border:1px solid #c7d4ee42;border-radius:9px}
#pink-christmas .actions button{font:500 14px system-ui,sans-serif;white-space:nowrap;padding:0 11px}
#pink-christmas .modes button{border-color:transparent;background:transparent;color:#d8dfed;border-radius:6px}
#pink-christmas .modes button[aria-pressed="true"]{background:#e9eefe;color:#172132}
#pink-christmas .modes button:disabled{color:#8f9ab3;cursor:default}
#pink-christmas .playback button{background:#172034e0;border:1px solid #c7d4ee42;color:#e8edfa;border-radius:6px}
#pink-christmas .actions button:focus-visible{outline:2px solid #ffd1e8;outline-offset:2px}
@media(max-width:650px){#pink-christmas .greeting{bottom:24%;right:5%}#pink-christmas .actions{left:5%}}
</style>
<div class="scene">
<canvas role="img" aria-label="蓝白粒子写出尚雲螣我只想和你，粒子绕同一竖轴旋转，收拢成圣诞树的枝干。可切换到尚雲螣粒子字样和立体爱心"></canvas>
<div class="greeting"><strong>Merry Christmas</strong><small>圣诞快乐 · 2026</small></div>
<div class="actions">
<div class="modes" role="group" aria-label="粒子形态">
  <button class="btn" type="button" data-mode="0" aria-pressed="true" disabled>圣诞树</button>
  <button class="btn" type="button" data-mode="1" aria-pressed="false" disabled>我只想和你</button>
  <button class="btn" type="button" data-mode="2" aria-pressed="false" disabled>爱心</button>
</div>
<div class="playback"><button class="btn" type="button" data-toggle>暂停</button><button class="btn" type="button" data-replay>重播</button></div></div>
</div>
<script>
(() => {
  const root = document.getElementById('pink-christmas');
  const canvas = root.querySelector('canvas');
  const ctx = canvas.getContext('2d');
  const dense = root.dataset.style === 'halo';
  const toggle = root.querySelector('[data-toggle]');
  const modeButtons = Array.from(root.querySelectorAll('[data-mode]'));
  const replay = root.querySelector('[data-replay]');
  const greeting = root.querySelector('.greeting');
  const tau = Math.PI * 2;
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  let seed = 2026;
  function random() {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    return seed / 4294967296;
  }

  // Each branch has a curved spine and fine sprays clustered around it.
  const needles = [];
  const branchSpines = [];
  const ornaments = [];
  const bulbs = [];
  for (let layer = 0; layer < 20; layer++) {
    const height = .085 + layer * .043;
    const count = (dense ? 7 : 4) + Math.floor(layer / 2);
    for (let branch = 0; branch < count; branch++) {
      const angle = (branch / count + layer * .382) * tau;
      const radius = (.04 + height * .51) * (.78 + random() * .32);
      const bend = (random() - .5) * .7;
      const tier = layer >= 16 ? (19 - layer) * 2 + branch % 2 : 23 - layer;
      const droop = .025 + height * .085;
      function point(u, spread, vertical) {
        const direction = angle + bend * u;
        return [
          Math.cos(direction) * radius * u - Math.sin(direction) * spread,
          height + droop * (u * u - u * .7) + vertical,
          Math.sin(direction) * radius * u + Math.cos(direction) * spread
        ];
      }
      if (!branchSpines[tier]) {
        branchSpines[tier] = Array.from({length: 40}, (_, tick) => {
          const u = tick / 39;
          const spine = point(u, 0, 0);
          if (tier === 23) spine[1] -= .038 * (1 - u) ** 2;
          return spine;
        });
      }
      for (let n = 0; n < (dense ? 144 : 89); n++) {
        const spray = (n % 23) / 23;
        const fan = Math.sin((n / 23 | 0) * 1.9 + spray * 10);
        const width = (.009 + height * .028) * Math.sin(Math.PI * spray);
        const spread = (fan * .7 + random() - .5) * width;
        needles.push([...point(spray + random() * .065, spread, (random() - .42) * width),
          random(), random(), tier, spray]);
      }
      if (random() < .32) ornaments.push([...point(.81 + random() * .17, 0, .019), random(), random(), tier]);
      if (random() < .65) bulbs.push([...point(.55 + random() * .43, 0, -.003), random(), tier]);
    }
  }
  const dust = Array.from({length: 380}, () => [random(), random(), random(), random()]);
  const burst = Array.from({length: 170}, (_, index) => {
    const direction = index * 2.399963 + (random() - .5) * .19;
    const depth = random() * 2 - 1;
    return {direction, spread: Math.sqrt(1 - depth * depth), heat: random()};
  });
  const codeBlocks = Array.from({length: 37}, (_, index) => ({
    x: random(), y: (index % 19 + random()) / 19,
    phase: random(), group: index % 3,
    rows: Array.from({length: 1 + Math.floor(random() * 4)}, () =>
      '尚雲螣我只想和你'.repeat(1 + Math.floor(random() * 4)))
  }));
  const floaters = Array.from({length: 18}, (_, index) => ({
    side: index % 2, shape: Math.floor(index / 2) % 4,
    height: (Math.floor(index / 2) + random()) / 9, phase: random() * tau,
    spread: random(), size: random()
  }));

  // Cache unit shapes so the same outlines work at every size.
  const ball = new Path2D();
  ball.arc(0, 0, 1, 0, tau);
  const heart = new Path2D(
    'M 0 .94 C -.32 .66 -1 .19 -1 -.34 C -1 -.99 -.28 -1.13 0 -.56 C .28 -1.13 1 -.99 1 -.34 C 1 .19 .32 .66 0 .94 Z'
  );
  const snowflake = new Path2D();
  for (let arm = 0; arm < 6; arm++) {
    const angle = arm * tau / 6;
    const x = Math.cos(angle);
    const y = Math.sin(angle);
    snowflake.moveTo(0, 0);
    snowflake.lineTo(x, y);
    for (const side of [-1, 1]) {
      snowflake.moveTo(x * .69, y * .69);
      snowflake.lineTo(x * .44 - y * side * .23, y * .44 + x * side * .23);
    }
  }
  const diamond = new Path2D('M 0 -1 L .68 0 L 0 1 L -.68 0 Z');
  const shapes = [ball, heart, snowflake, diamond];
  const heartRays = [[-.94, 2.8], [-1.35, 2.1], [-2.48, 2.4],
    [-2.05, 1.6], [.62, 2.2], [1.16, 1.7], [2.53, 2]];
  const heartFragments = [];
  for (let row = -6; row <= 6; row++) {
    for (let column = -6; column <= 6; column++) {
      const x = (column + (random() - .5) * .65) * .158;
      const y = (row + (random() - .5) * .65) * .158;
      if (ctx.isPointInPath(heart, x, y)) {
        heartFragments.push({
          x, y, delay: random(), phase: random() * tau, weight: random(),
          angle: random() * tau
        });
      }
    }
  }

  function drawCode(t, narrow, reveal) {
    const fontSize = narrow ? 9 : Math.max(10, Math.min(14, width * .01));
    ctx.font = fontSize + 'px Consolas, "Microsoft YaHei", monospace';
    ctx.textBaseline = 'middle';
    for (const block of codeBlocks) {
      const cycle = t * (.16 + block.phase * .1) + block.phase;
      const flash = Math.sin(Math.PI * (cycle % 1)) ** 8;
      const jump = Math.floor(cycle) % 3 - 1;
      const drift = Math.sin(t * .31 + block.phase * tau) * width * .013;
      const x = width * ([.025, .34, .75][block.group] + block.x * (block.group === 2 ? .15 : .24))
        + drift + jump * fontSize * .7;
      const y = height * (.025 + block.y * .87) + Math.sin(t * .43 + block.phase * tau) * fontSize;
      ctx.textAlign = block.group === 2 ? 'right' : 'left';
      ctx.fillStyle = block.group === 0 ? '#d7c8db' : '#f0f5ff';
      for (const [row, line] of block.rows.entries()) {
        ctx.globalAlpha = reveal * (.05 + flash * (block.group === 1 ? .10 : .27)) * (1 - row * .15);
        ctx.fillText(line, x + row * fontSize * .65, y + row * fontSize * 1.15);
      }
    }
    ctx.textAlign = 'start';
  }

  function drawOrnament(x, y, radius, shape, pale, alpha, angle, lit) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.scale(radius, radius);
    ctx.globalAlpha = alpha;
    ctx.lineJoin = 'round';
    if (shape === 2) {
      ctx.strokeStyle = pale ? '#fff6fd' : '#f5b5d8';
      ctx.lineWidth = .15;
      ctx.stroke(snowflake);
    } else {
      const surface = ctx.createRadialGradient(-.35, -.43, .05, 0, 0, 1);
      surface.addColorStop(0, '#fffaff');
      surface.addColorStop(.38, pale ? '#fff0f9' : '#f5badb');
      surface.addColorStop(1, lit ? (pale ? '#64738a' : '#7a486e') : '#b9a4b9');
      ctx.fillStyle = surface;
      ctx.fill(shapes[shape]);
    }
    ctx.restore();
  }

  function glowSprite(rgb) {
    const sprite = document.createElement('canvas');
    sprite.width = sprite.height = 96;
    const pen = sprite.getContext('2d');
    const gradient = pen.createRadialGradient(48,48,0,48,48,48);
    gradient.addColorStop(0, 'white');
    gradient.addColorStop(.09, 'rgba(' + rgb + ',.95)');
    gradient.addColorStop(.27, 'rgba(' + rgb + ',.38)');
    gradient.addColorStop(1, 'rgba(' + rgb + ',0)');
    pen.fillStyle = gradient;
    pen.fillRect(0,0,96,96);
    return sprite;
  }
  const pinkGlow = glowSprite('72,155,255');
  const whiteGlow = glowSprite('232,243,255');
  const needlesColors = ['#427abf','#619ffc','#85c4ff','#fff9ff'];

  let width, height, pixelRatio;

  const stillFrame = 9.6;
  let elapsed = motion.matches ? stillFrame : 0;
  let playing = !motion.matches;
  let previous = null;
  let frame = 0;
  const smooth = value => {
    const t = Math.max(0,Math.min(1,value));
    return t * t * (3 - 2 * t);
  };

  // Original lettering. Each entry gives an ink centerline and its stroke weight.
  // Brush shapes are drawn here, independent of fonts installed on the device.
  const splitStart = 4.5;
  const orbitStart = 5.1;
  const morphEnd = 8.5;
  const treeSpin = .28;
  const initialAngle = .45;
  const mix = (from, to, fraction) => from + (to - from) * fraction;

  function drawFireworks(t, narrow, glow, strength = 1) {
    const radius = Math.min(width * (narrow ? .20 : .15), height * .31);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    for (const side of [0, 1]) {
      const clock = t - morphEnd - 1.5 - side * 1.35;
      if (clock < 0) continue;
      const cycle = Math.floor(clock / 6.5);
      const phase = clock % 6.5;
      const x = width * (side ? .83 : .17) + Math.sin(cycle * 2.4 + side) * radius * .22;
      const y = height * ((side ? .34 : .26) + Math.sin(cycle * 1.4) * .06);
      const age = phase - .92;
      if (age < 0) {
        const rise = phase / .92;
        const launchX = x + (side ? 1 : -1) * radius * .16 * (1 - rise);
        const launchY = y + radius * 1.65 * (1 - rise) ** 1.45;
        for (let i = 8; i >= 0; i--) {
          glow(i % 4 ? whiteGlow : pinkGlow, launchX, launchY + i * 2.6,
            Math.max(2, radius * .036), (1 - i / 9) * .78);
        }
        continue;
      }
      if (age > 3.4) continue;
      glow(whiteGlow, x, y, radius * .46, Math.exp(-age * 11) * .9);
      const travel = (1 - Math.exp(-age * 1.55)) * radius;
      for (const spark of burst) {
        const angle = spark.direction + cycle * .38 + side;
        const speed = spark.spread * (.72 + spark.heat * .42);
        const vx = Math.cos(angle) * speed;
        const vy = Math.sin(angle) * speed;
        const gravity = radius * .071;
        const tipX = x + vx * travel;
        const tipY = y + vy * travel + gravity * age * age;
        const tailAge = Math.max(0, age - (.13 + spark.heat * .22));
        const tailTravel = (1 - Math.exp(-tailAge * 1.55)) * radius;
        const tailX = x + vx * tailTravel;
        const tailY = y + vy * tailTravel + gravity * tailAge * tailAge;
        const life = 2.15 + spark.heat * 1.25;
        const fade = Math.max(0, 1 - age / life) ** 1.3;
        if (fade === 0) continue;
        const shimmer = .62 + .38 * Math.sin(age * 14 + spark.direction) ** 2;
        const pink = spark.heat < .17;
        ctx.strokeStyle = pink ? '#92c7ff' : '#eef6ff';
        ctx.lineWidth = .55 + .9 * spark.heat;
        ctx.globalAlpha = fade * shimmer * .68 * strength;
        ctx.beginPath();
        ctx.moveTo(tailX, tailY);
        ctx.lineTo(tipX, tipY);
        ctx.stroke();
        glow(pink ? pinkGlow : whiteGlow, tipX, tipY,
          Math.max(1.7, radius * (.015 + spark.heat * .024)), fade * shimmer);
      }
    }
    ctx.restore();
  }
  function ellipse(ctx, x, y, rx, ry, color, angle = 0) {
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, angle, 0, tau);
    ctx.fillStyle = color;
    ctx.fill();
  }

  function softFur(ctx, light, shadow) {
    const fur = ctx.createLinearGradient(-34, -99, 32, -7);
    fur.addColorStop(0, light);
    fur.addColorStop(1, shadow);
    return fur;
  }

  function drawChiikawa(t, ctx) {
    const fur = softFur(ctx, '#fff', '#c9e3ff');
    ellipse(ctx,0,-24,23,23,fur);
    for (const side of [-1,1]) {
      ellipse(ctx,side*22,-85,12,14,fur);
      ellipse(ctx,side*13,-7,9,6,fur);
    }
    ellipse(ctx,0,-59,37,29,fur);
    const blink = Math.abs(((t+1.1)%5.4)-2.7)<.12;
    for (const side of [-1,1]) {
      ellipse(ctx,side*12,-62,4,blink?.8:4.6,'#192540');
      ellipse(ctx,side*21,-54,6,3.7,'#f6adc4');
    }
    ellipse(ctx,0,-53,3.2,1.7,'#394260');
  }
  function drawKitty(t,ctx) {
    const fur = softFur(ctx,'#fff','#cde4ff');
    ellipse(ctx,0,-23,24,22,'#73acf5');
    for (const side of [-1,1]) {
      ellipse(ctx,side*13,-8,9,7,fur);
      ellipse(ctx,side*(24+Math.sin(t*1.8)*2),-29,8,8,fur);
      ctx.beginPath();
      ctx.moveTo(side*13,-75);
      ctx.quadraticCurveTo(side*29,-101,side*32,-93);
      ctx.lineTo(side*36,-64);
      ctx.closePath();
      ctx.fillStyle=fur;
      ctx.fill();
    }
    ellipse(ctx,0,-60,38,26,fur);
    for (const side of [-1,1]) {
      ellipse(ctx,side*15,-60,2.8,4.1,'#18213b');
      ctx.beginPath();
      for(let i=0;i<3;i++) {
        ctx.moveTo(side*26,-63+i*5);
        ctx.lineTo(side*43,-66+i*7);
      }
      ctx.strokeStyle='#b7d3f9';
      ctx.lineWidth=2.4;
      ctx.stroke();
    }
    ellipse(ctx,0,-54,4.4,2.8,'#f8d66c');
    ellipse(ctx,21,-82,9,7,'#f65b81',-.42);
    ellipse(ctx,34,-82,9,7,'#f65b81',.42);
    ellipse(ctx,27.5,-81,4.9,4.9,'#ffc3d2');
  }

  // Sample the silhouettes into spaced points. Only the points reach the scene.
  function sampleCompanion(draw, times, warm) {
    const mask = document.createElement('canvas');
    mask.width = 122;
    mask.height = 108;
    const pen = mask.getContext('2d', {willReadFrequently: true});
    return times.map(time => {
      pen.setTransform(1, 0, 0, 1, 55, 105);
      pen.clearRect(-55, -105, mask.width, mask.height);
      draw(time, pen);
      const data = pen.getImageData(0, 0, mask.width, mask.height).data;
      const points = [];
      for (let row = 1; row < mask.height - 3; row += 3) {
        for (let column = 1; column < mask.width - 1; column += 3) {
          const index = (row * mask.width + column) * 4;
          if (data[index + 3] < 170) continue;
          const chroma = data[index] - data[index + 2];
          const light = (data[index] + data[index + 1] + data[index + 2]) / 765;
          const noise = Math.sin(row * 9.21 + column * 3.89);
          const color = data[index] - data[index + 1] > 35 ? '#ff7099' : light < .34 ? '#738398' : warm && chroma > 26 ?
            (light > .73 ? '#fff3d9' : '#edc197') : '#eef6ff';
          points.push({
            x: column - 55 + noise * .45, y: row - 105 + Math.cos(row + column * 7) * .45,
            light, noise, color
          });
        }
      }
      return points;
    });
  }

  const chiikawaCloud = sampleCompanion(drawChiikawa, [0, 1.60], false);
  const kittyCloud = sampleCompanion(drawKitty, Array.from({length: 15}, (_, i) =>
    Math.asin((i - 7) / 7) / 1.8), false);

  function paintCompanion(points, time, reveal) {
    const scatter = (1 - reveal) * 17;
    for (const point of points) {
      const twinkle = .77 + .23 * Math.sin(time * 1.65 + point.noise * 22) ** 2;
      const x = point.x + Math.cos(point.y + point.noise * 7) * scatter;
      const y = point.y + point.noise * scatter;
      const dot = .67 + point.light * .62;
      ctx.fillStyle = point.color;
      ctx.globalAlpha = reveal * twinkle * (.28 + .68 * point.light);
      ctx.beginPath();
      ctx.arc(x, y, dot * .83, 0, tau);
      ctx.fill();
      if (point.noise > .94 && point.light > .6) {
        ctx.globalAlpha *= .16;
        ctx.beginPath();
        ctx.arc(x, y, dot * 1.65, 0, tau);
        ctx.fill();
      }
    }
  }

  function drawCompanions(t, narrow, size, top, orbit, strength) {
    const reveal = strength * smooth((orbit - .66) / .33);
    if (reveal === 0) return;
    const unit = narrow ? Math.min(width * .00152, size * .0030) : Math.min(1.02, size * .00194);
    const floor = narrow ? top + size * .97 : Math.min(top + size * .92, height * .79);
    const blink = Math.abs(((t + 1.1) % 5.4) - 2.7) < .12 ? 1 : 0;
    const tail = Math.round(7 + Math.sin(t * 1.8) * 7);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const [position, points] of [[narrow ? .125 : .29, chiikawaCloud[blink]],
      [narrow ? .867 : .869, kittyCloud[tail]]]) {
      ctx.save();
      ctx.translate(width * position, floor);
      ctx.scale(unit, unit);
      paintCompanion(points, t, reveal);
      ctx.restore();
    }
    ctx.restore();
  }

  // The same dot owns one coordinate in each form. Blended weights preserve its
  // exact position when a new target interrupts a transition.
  function sampleText(text, columns, splitAfter = 0) {
    const mask = document.createElement('canvas');
    mask.width = columns * 110;
    mask.height = (splitAfter ? 2 : Math.ceil(text.length / columns)) * 116;
    const pen = mask.getContext('2d', {willReadFrequently:true});
    pen.font = 'bold 94px "Microsoft YaHei", "PingFang TC", "Noto Sans CJK TC", sans-serif';
    pen.textBaseline = 'middle';
    pen.textAlign = 'center';
    pen.fillStyle = 'white';
    Array.from(text).forEach((char,i) => {
      const row = splitAfter ? Number(i >= splitAfter) : Math.floor(i / columns);
      const count = splitAfter ? (row ? text.length - splitAfter : splitAfter) : columns;
      const column = splitAfter ? i - row * splitAfter : i % columns;
      pen.fillText(char,(column + (columns - count) / 2 + .5)*110,(row + .52)*116);
    });
    const data = pen.getImageData(0,0,mask.width,mask.height).data;
    const points = [];
    for(let y=0;y<mask.height;y+=2)for(let x=0;x<mask.width;x+=2) {
      if(data[(y*mask.width+x)*4+3]>165)points.push([x-mask.width/2,y-mask.height/2]);
    }
    return points;
  }
  const introWide = sampleText('尚雲螣我只想和你',8);
  const introNarrow = sampleText('尚雲螣我只想和你',5,3);
  const namePoints = sampleText('尚雲螣',3);
  const particles = needles.filter((_,index)=>index%3===0).map(needle=>{
    const name=namePoints[Math.floor(random()*namePoints.length)];
    const wide=introWide[Math.floor(random()*introWide.length)];
    const narrow=introNarrow[Math.floor(random()*introNarrow.length)];
    let x, y, distance;
    const depth = (random() * 2 - 1);
    do {
      x = random() * 2.4 - 1.2;
      y = random() * 2.25 - 1.03;
      distance = x * x + y * y - 1;
    } while (distance ** 3 - x * x * y ** 3 > 0);
    const bevel = Math.sqrt(Math.max(.045, Math.min(1, 1 - Math.hypot(x * .72, y * .69))));
    const heart = [x * .385, .49 - y * .38, depth * bevel * .25];
    return {needle, name, wide, narrow, heart, shimmer: random() * tau, glint: random() < .09};
  });

  const particleTints = ["#e8edf9", "#dcecff", "#bcdaff", "#9bcdff", "#83beff",
    "#6baeff", "#569eff", "#4697ff", "#3386fa"];
  const transitionDuration = 1.6;
  const forms = [[1, 0, 0], [0, 1, 0], [0, 0, 1]];
  let mode = 0;
  let fromWeights = forms[0];
  let changedAt = 0;
  function weightsAt(t) {
    const phase = motion.matches ? 1 : smooth((t - changedAt) / transitionDuration);
    return forms[mode].map((weight, i) => mix(fromWeights[i], weight, phase));
  }
  function updateModeButtons() {
    modeButtons.forEach((button, index) => {
      button.disabled = elapsed < morphEnd;
      button.setAttribute('aria-pressed', String(index === mode));
    });
  }
  function selectMode(index) {
    if (elapsed < morphEnd || index === mode) return;
    fromWeights = weightsAt(elapsed);
    changedAt = elapsed;
    mode = index;
    updateModeButtons();
    if (!playing && !motion.matches) setPlaying(true);
    paint(elapsed);
  }

  function paint(t) {
    const narrow = width < 650;
    const [treeWeight, nameWeight, heartWeight] = weightsAt(t);
    const nameMotion = !motion.matches && nameWeight > 0;
    const sweepHead = (t * .31) % 1;
    const split = smooth((t - splitStart) / (orbitStart - splitStart));
    const orbitTime = morphEnd - orbitStart;
    const orbit = Math.max(0, Math.min(1, (t - orbitStart) / orbitTime));
    // One shared clock, with just enough variation to make the branch layers legible.
    const tiers = branchSpines.map((_, index) => smooth((orbit - index * .004) / .90));
    const detailsOn = treeWeight * smooth((orbit - .32) / .65);
    const footGlow = treeWeight * smooth((orbit - .53) / .39);
    const size = Math.min(height * (narrow ? .62 : .81), width * (narrow ? .81 : .55));
    const scale = size;
    const center = width * (narrow ? .5 : .56);
    const top = (height - size) * (narrow ? .32 : .5);
    const coast = treeSpin * orbitTime / 2;
    const angle = (tau - coast) * smooth(orbit) + coast * orbit ** 2;
    const rotation = initialAngle + angle + Math.max(0, t - morphEnd) * treeSpin;
    const cos = Math.cos(rotation);
    const sin = Math.sin(rotation);
    const nameUnit = Math.min(width * .00261, size * .00315) / size;
    const nameTime = nameMotion ? t : 0;
    const nameRise = Math.sin(nameTime * 1.07) * .05;
    const nameSlide = Math.sin(nameTime * .71) * .028;
    const nameTilt = Math.sin(nameTime * .89) * .10;
    const nameAngle = rotation - Math.sin(nameTime * .78) * .33;
    const nameTiltCos = Math.cos(nameTilt);
    const nameTiltSin = Math.sin(nameTilt);
    const nameAngleCos = Math.cos(nameAngle);
    const nameAngleSin = Math.sin(nameAngle);
    const nameY = (height * .46 - top) / size + nameRise;
    const glyphMotion = [0, 1, 2].map(glyph => {
      const phase = nameTime * 1.24 - (glyph - 1) * .64;
      const tilt = nameMotion ? Math.sin(phase * .86) * .037 : 0;
      return {
        rise: nameMotion ? Math.sin(phase) * .012 : 0,
        cos: Math.cos(tilt),
        sin: Math.sin(tilt)
      };
    });
    // Let the heart rock far enough to show its depth while keeping both lobes visible.
    const heartOffset = rotation - .56 * Math.sin(t * .76);
    const heartCos = Math.cos(heartOffset);
    const heartSin = Math.sin(heartOffset);
    function project(x,y,z) {
      const depth = z * cos - x * sin;
      const perspective = 1 / (1 - depth * .28);
      return [center + (x * cos + z * sin) * scale * perspective,
        top + (.46 + (y - .46 + depth * .14) * perspective) * scale, perspective];
    }
    function glow(sprite,x,y,radius,alpha) {
      ctx.globalAlpha = alpha;
      ctx.drawImage(sprite,x-radius,y-radius,radius*2,radius*2);
    }

    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#050b1c';
    ctx.fillRect(0,0,width,height);
    const haze = ctx.createRadialGradient(center, height*.56,0,center,height*.53,height*.62);
    haze.addColorStop(0,'#102a58');
    haze.addColorStop(1,'#050b1c');
    ctx.fillStyle = haze;
    ctx.fillRect(0,0,width,height);
    ctx.fillStyle = '#f3f7ff';
    for (const [x,y,a,b] of dust) {
      ctx.globalAlpha = a * (.13 + .2 * Math.sin(t*.55+b*32)**2);
      const dot = .45 + b * 1.35;
      ctx.fillRect(x*width, ((y+t*.006)%1)*height,dot,dot);
    }
    drawCode(t, narrow, (.17 + treeWeight * .83) * smooth((orbit - .42) / .58));
    if (treeWeight > .01) drawFireworks(t, narrow, (sprite, x, y, radius, alpha) =>
      glow(sprite, x, y, radius, alpha * treeWeight), treeWeight);
    for (const item of floaters) {
      const x = width * (item.side ? .79 + item.spread * .15 : .06 + item.spread * .16)
        + Math.sin(t * .59 + item.phase) * width * .022;
      const y = height * (.16 + item.height * (narrow ? .49 : .53))
        + Math.cos(t * .51 + item.phase) * size * .03;
      const radius = Math.max(2.5, size * (.009 + item.size * .012));
      const alpha = detailsOn * (.42 + .28 * Math.sin(t * .65 + item.phase) ** 2);
      glow(item.shape === 1 ? pinkGlow : whiteGlow, x, y, radius * 2.3, alpha * .30);
      drawOrnament(x, y, radius, item.shape, item.shape !== 1, alpha,
        Math.sin(t * .71 + item.phase) * .65, false);
    }

    const [trunkX,trunkY] = project(0,.83,0);
    const trunk = ctx.createLinearGradient(trunkX-size*.021,0,trunkX+size*.021,0);
    trunk.addColorStop(0,'#140b16');
    trunk.addColorStop(.58,'#5b354b');
    trunk.addColorStop(1,'#1c101e');
    ctx.globalAlpha = detailsOn;
    ctx.fillStyle = trunk;
    ctx.fillRect(trunkX-size*.021,trunkY,size*.042,scale*.15);

    ctx.globalCompositeOperation = 'lighter';
    const opening = t < morphEnd;
    const introUnit = Math.min(width/(narrow?620:1060),size*.0027)/size;
    const introProgress = smooth((t-orbitStart)/(morphEnd-orbitStart));
    const release = smooth((t-splitStart)/(orbitStart-splitStart));
    for (const {needle,name,wide: wideInk,narrow: narrowInk,heart,shimmer,glint} of particles) {
      let [x,y,z,a,b,tier]=needle;
      let foliage=tiers[tier];
      const drift=nameMotion&&glint?Math.max(0,Math.sin(t*1.55+shimmer))**3:0;
      const lightFlow=nameMotion?Math.sin(t*1.8-name[0]*.057)**8:0;
      const taper=1;
      const glyph=glyphMotion[Math.min(2,Math.max(0,Math.floor((name[0]+165)/110)))];
      const wordX=name[0]*nameUnit+Math.cos(t+shimmer)*drift*.014;
      const wordY=name[1]*nameUnit+glyph.rise-drift*.016;
      const nameX=(wordX*nameTiltCos-wordY*nameTiltSin)*nameAngleCos+nameSlide*cos;
      const nameYOnStroke=nameY+wordY*nameTiltCos+wordX*nameTiltSin;
      const nameZ=(wordX*nameTiltCos-wordY*nameTiltSin)*nameAngleSin+nameSlide*sin;
      if(opening){
        const point=narrow?narrowInk:wideInk;
        const sourceX=point[0]*introUnit+Math.sin(shimmer*3)*.065*release;
        const sourceY=(height*.45-top)/size+point[1]*introUnit+Math.cos(shimmer*2)*.07*release;
        const d=Math.sin(shimmer*5)*.24*release;
        x=mix(sourceX*Math.cos(initialAngle)-d*Math.sin(initialAngle),x,introProgress);
        y=mix(sourceY,y,introProgress);
        z=mix(sourceX*Math.sin(initialAngle)+d*Math.cos(initialAngle),z,introProgress);
        const order=point[0]/(narrow?550:880)+.5+(narrow&&point[1]>0?.35:0);
        foliage=mix(smooth((t-order*2.2)/.55),1,introProgress);
      }
      const heartX = heart[0] * heartCos - heart[2] * heartSin;
      const heartZ = heart[0] * heartSin + heart[2] * heartCos;
      let [px,py,p] = project(x * treeWeight + nameX * nameWeight + heartX * heartWeight,
        y * treeWeight + nameYOnStroke * nameWeight + heart[1] * heartWeight,
        z * treeWeight + nameZ * nameWeight + heartZ * heartWeight);
      if (px < -5 || px > width + 5 || py < -5 || py > height + 5) continue;
      const twinkle = .68 + .32 * Math.sin(t * 1.7 + shimmer) ** 2;
      const dot = Math.max(.62, size * .0020) * p * (.55 + b) * (1 - .29 * nameWeight);
      const pink = Math.round(heartWeight * (glint ? .35 : .95) * 8
        + nameWeight * (a > .95 ? .25 : .03) * 8);
      ctx.fillStyle = pink > 0 ? particleTints[pink] : (nameWeight > .45 || opening && introProgress < .5) ? "#a9d9ff" : needlesColors[Math.floor(a * 4)];
      ctx.globalAlpha = twinkle * (treeWeight * foliage * (.24 + .65*b + (opening ? .16 * (1 - introProgress) : 0))
        + nameWeight * taper * (.42 + .43*b + .15*lightFlow) + heartWeight * (.40 + .56*b))
        * (p > 1 ? 1 : .68);
      ctx.fillRect(px, py, dot * (1 + .4*treeWeight), dot * (.92 - .16*treeWeight));
      if (glint && nameWeight + heartWeight > .15) {
        glow(pink > 2 ? pinkGlow : whiteGlow, px, py, dot * (3.5 + .55 * nameWeight),
          twinkle * ((.24 + .28 * lightFlow + .18 * drift) * nameWeight * taper + .30 * heartWeight));
      }
    }

    for (const [x,y,z,phase,tier] of bulbs) {
      const [px,py,p] = project(x,y,z);
      const flash = (.43 + .57*Math.sin(t*1.9+phase*45)**4) * treeWeight * smooth((tiers[tier] - .84) / .16);
      glow(phase > .16 ? whiteGlow : pinkGlow,px,py, size*(dense ? .025 : .017)*p,flash);
    }

    const decorations = ornaments.map(([x,y,z,a,b,tier], index) =>
      [...project(x,y,z),a,b,index % shapes.length,tiers[tier]]);
    decorations.sort((a,b) => a[2] - b[2]);
    ctx.globalCompositeOperation = 'source-over';
    for (const [x,y,p,a,b,shape,growth] of decorations) {
      const radius = Math.max(1.1,scale*(dense ? .009+.010*b : .006+.007*b)*p);
      if (x < -radius || x > width+radius || y < -radius || y > height+radius) continue;
      drawOrnament(x, y, radius, shape, a > .19, treeWeight * (p < 1 ? .66 : .97) * smooth((growth - .84) / .16),
        Math.sin(t * .82 + a * tau) * .43, true);
    }

    ctx.globalCompositeOperation = 'lighter';
    const steps = dense ? 270 : 960;
    for (let i = 0; i <= steps; i++) {
      const u = i / steps;
      const band = Math.min(23, (1 - u) * 23);
      const near = Math.floor(band);
      const presence = mix(tiers[near], tiers[Math.min(23, near + 1)], band - near);
      const lightOn = treeWeight * smooth((presence - .75) / .25);
      if (lightOn === 0) continue;
      const angle = u * tau * (dense ? 2.5 : 6.2) - t * .62;
      const radius = dense ? .045 + .47 * u : .027 + .49 * u;
      const [x,y,p] = project(Math.cos(angle)*radius,.102+.81*u,Math.sin(angle)*radius);
      const pulse = .54 + .46 * Math.sin(u * 25 - t * 2.1) ** 4;
      const pink = dense ? i % 11 === 0 : i % 17 === 0;
      glow(pink ? pinkGlow : whiteGlow,x,y,size*(dense ? .012 : .009)*p,
        pulse * lightOn * (dense ? .25 : .22));
      ctx.globalAlpha = pulse * lightOn * (dense ? .56 : .84);
      ctx.fillStyle = pink ? '#71beff' : '#f7fbff';
      const dot = size * (dense ? .0025 : .0022) * p;
      ctx.fillRect(x-dot/2,y-dot/2,dot,dot);
    }

    if (dense) {
      for (let ring = 0; ring < 3; ring++) {
        for (let i = 0; i < 144; i++) {
          const angle = i * tau / 144 + t * (.23 - ring * .13);
          const radius = .44 + ring * .062;
          const [x,y,p] = project(Math.cos(angle)*radius,.93,Math.sin(angle)*radius);
          const sweep = .24 + .76 * Math.sin(angle - t * .8 + ring) ** 8;
          const dot = size * .0029 * p;
          ctx.globalAlpha = sweep * footGlow * .70;
          ctx.fillStyle = ring === 2 ? '#559eff' : '#eff7ff';
          ctx.fillRect(x-dot/2,y-dot/2,dot,dot);
        }
      }
    }

    const [heartX,heartY] = project(0,.021,0);
    const shine = treeWeight * smooth((t - morphEnd) / 1.1) * (.88 + .12 * Math.sin(t * 2.4));
    const heartSize = size * .045;
    glow(whiteGlow, heartX, heartY, size * .22, shine * .45);
    ctx.save();
    ctx.translate(heartX, heartY);
    ctx.save();
    ctx.scale(7.5, .30);
    glow(whiteGlow, 0, 0, size * .105, shine * .50);
    ctx.restore();
    ctx.scale(heartSize, heartSize);
    for (const [angle, length] of heartRays) {
      const dx = Math.cos(angle);
      const dy = Math.sin(angle);
      const ray = ctx.createLinearGradient(0, 0, dx * length, dy * length);
      ray.addColorStop(0, '#f5faff');
      ray.addColorStop(1, '#e5efff00');
      ctx.strokeStyle = ray;
      ctx.globalAlpha = shine * .79;
      ctx.lineWidth = .032;
      ctx.beginPath();
      ctx.moveTo(dx * .5, dy * .5);
      ctx.lineTo(dx * length, dy * length);
      ctx.stroke();
    }
    for (const fragment of heartFragments) {
      const settle = smooth((t - morphEnd - fragment.delay * .33) / .69);
      if (settle === 0) continue;
      const spread = (1 - settle) * 2.2;
      const x = fragment.x + Math.cos(fragment.angle) * spread;
      const y = fragment.y + Math.sin(fragment.angle) * spread;
      const flicker = .63 + .37 * Math.sin(t * 2.6 + fragment.phase) ** 4;
      const opacity = treeWeight * settle * flicker * (.76 + shine * .24);
      const radius = .032 + fragment.weight * .041;
      const white = fragment.weight > .18;
      glow(white ? whiteGlow : pinkGlow, x, y, radius * 2.6, opacity * .65);
      ctx.globalAlpha = opacity;
      ctx.fillStyle = white ? '#fff8ff' : '#81c5ff';
      ctx.fillRect(x - radius * .72, y - radius * .52, radius * 1.44, radius * 1.04);
    }
    ctx.restore();

    drawCompanions(t, narrow, size, top, orbit, treeWeight);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    greeting.style.opacity = treeWeight * smooth((t-morphEnd)/1.25);
  }

  function resize() {
    width = canvas.clientWidth;
    height = canvas.clientHeight;
    if (!width || !height) return;
    pixelRatio = Math.min(devicePixelRatio, 1.75);
    canvas.width = Math.round(width*pixelRatio);
    canvas.height = Math.round(height*pixelRatio);
    ctx.setTransform(pixelRatio,0,0,pixelRatio,0,0);
    paint(elapsed);
  }
  function animate(now) {
    if (previous !== null) elapsed += Math.min((now-previous)/1000,.1);
    previous = now;
    paint(elapsed);
    if (elapsed >= morphEnd && modeButtons[0].disabled) updateModeButtons();
    frame = requestAnimationFrame(animate);
  }
  function setPlaying(active) {
    cancelAnimationFrame(frame);
    previous = null;
    playing = active;
    toggle.textContent = active ? '暂停' : '播放';
    if (active) frame = requestAnimationFrame(animate);
  }
  modeButtons.forEach((button, index) => { button.onclick = () => selectMode(index); });
  updateModeButtons();
  toggle.onclick = () => setPlaying(!playing);
  replay.onclick = () => {
    elapsed = 0;
    changedAt = 0;
    mode = 0;
    fromWeights = forms[0];
    updateModeButtons();
    paint(elapsed);
    setPlaying(true);
  };
  motion.addEventListener('change', event => {
    if (event.matches) {
      elapsed = stillFrame;
      updateModeButtons();
      paint(elapsed);
      setPlaying(false);
    }
  });
  new ResizeObserver(resize).observe(canvas);
  resize();
  setPlaying(playing);
})();
</script>
</main>
